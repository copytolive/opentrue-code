title = "OpenTrue Code secret scanning policy"
minVersion = "8.30.1"

[extend]
useDefault = true

# Keep the default Gitleaks rules. Only suppress the repository-owned values that
# are deliberately synthetic examples/test fixtures. A real credential in the
# same files still fails because it will not match one of these value prefixes.
[[allowlists]]
description = "Synthetic placeholder and CI-only credentials"
targetRules = ["generic-api-key"]
regexTarget = "line"
regexes = [
  '''(?i)(?:password|secret|token|key)\s*[:=]\s*["']?replace-with-[a-z0-9-]+["']?''',
  '''(?i)(?:password|secret|token|key)\s*[:=]\s*["']?test-[a-z0-9-]+["']?''',
  '''(?i)(?:password|secret|token|key)\s*[:=]\s*["']?smoke-[a-z0-9-]+["']?'''
]
