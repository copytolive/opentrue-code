name: OpenTrue Maintenance

on:
  schedule:
    - cron: '17 20 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  maintenance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Setup Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Public repository policy
        run: bash scripts/validate-public-repo.sh
      - name: Agent runtime
        working-directory: agent-runtime
        run: |
          npm run check
          npm test
      - name: Local Bridge
        working-directory: local-bridge
        run: npm test
      - name: Control-plane dependency audit
        working-directory: control-plane
        run: npm audit --audit-level=high --omit=dev
      - name: UI dependency audit
        working-directory: ui
        run: npm audit --audit-level=high --omit=dev
      - name: Bugbot latest change
        run: |
          if git rev-parse HEAD~1 >/dev/null 2>&1; then
            node agent-runtime/bin/opentrue.mjs bugbot HEAD~1
          fi
      - name: Maintenance evidence
        run: |
          mkdir -p receipts
          printf '{"revision":"%s","verifiedAt":"%s","status":"PASS"}\n' "$GITHUB_SHA" "$(date -u +%FT%TZ)" > receipts/maintenance.json
      - name: Upload maintenance evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: opentrue-maintenance-${{ github.sha }}
          path: receipts/maintenance.json
          if-no-files-found: error
