name: UI and runtime images
on:
  pull_request:
    paths:
      - "ui/**"
      - "editor/**"
      - "workers/**"
      - "deploy/**"
      - "scripts/install-macos.sh"
      - "scripts/install-local-bridge-macos.sh"
      - "scripts/install-deploy-worker-linux.sh"
      - "scripts/install-windows.ps1"
      - "scripts/health-check.sh"
      - "scripts/health-check.ps1"
      - "scripts/sandbox-escape-test.sh"
      - "docker-compose.yml"
      - "docker-compose.sandbox.yml"
      - ".env.example"
      - ".github/workflows/ui-runtime.yml"
  push:
    branches: [main]
    paths:
      - "ui/**"
      - "editor/**"
      - "workers/**"
      - "deploy/**"
      - "scripts/**"
      - "docker-compose.yml"
      - "docker-compose.sandbox.yml"
      - ".env.example"
      - ".github/workflows/ui-runtime.yml"
permissions:
  contents: read
env:
  CODE_SERVER_IMAGE: codercom/code-server:4.133.0@sha256:e073a441c61c85821a7f16b64cf93b4e77b4092899bb1f3bed906fbd558afd62
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: 22}
      - name: Validate installer syntax
        shell: bash
        run: |
          bash -n scripts/install-macos.sh scripts/install-local-bridge-macos.sh scripts/install-deploy-worker-linux.sh scripts/health-check.sh scripts/validate-public-repo.sh
          node --check workers/vast-worker.mjs workers/sandbox-worker.mjs workers/deploy-worker.mjs scripts/model-benchmark.mjs
          pwsh -NoProfile -Command '$tokens=$null; $errors=$null; [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path "scripts/install-windows.ps1"), [ref]$tokens, [ref]$errors) | Out-Null; [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path "scripts/health-check.ps1"), [ref]$tokens, [ref]$errors) | Out-Null; if ($errors.Count) { $errors | ForEach-Object { Write-Error $_.Message }; exit 1 }'
      - name: Build browser UI
        working-directory: ui
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Build code-server with Cline
        run: |
          docker build \
            --build-arg CODE_SERVER_IMAGE="$CODE_SERVER_IMAGE" \
            --build-arg CLINE_VERSION=4.1.3 \
            -t opentrue-editor-ci ./editor
      - name: Build sandbox worker
        run: docker build -f workers/Dockerfile.sandbox -t opentrue-sandbox-ci workers
      - name: Prove Bubblewrap isolation on host kernel
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap
          sudo sh scripts/sandbox-escape-test.sh
      - name: Validate compose
        env:
          CODE_SERVER_PASSWORD: test-password
          POSTGRES_PASSWORD: test-postgres-password
          REDIS_PASSWORD: test-redis-password
          AUTH_SIGNING_SECRET: test-auth-signing-secret-at-least-32-characters
          BILLING_WEBHOOK_SECRET: test-billing-secret-at-least-32-characters
          METRICS_TOKEN: test-metrics-token-at-least-32-characters
          WEBUI_SECRET_KEY: test-webui-secret-at-least-32-characters
          BASE_DOMAIN: example.test
          APP_DOMAIN: code.example.test
          ACME_EMAIL: admin@example.test
          CODE_SERVER_IMAGE: ${{ env.CODE_SERVER_IMAGE }}
          CLINE_VERSION: 4.1.3
          OLLAMA_IMAGE: ollama/ollama:0.32.14
          OPEN_WEBUI_IMAGE: ghcr.io/open-webui/open-webui:v0.11.0
          OLLAMA_MODEL: qwen3-coder:30b
          SANDBOX_WORKER_TOKEN: test-sandbox-token
          SANDBOX_WORKSPACE_ROOT: /tmp/opentrue-sandbox
        run: |
          mkdir -p /tmp/opentrue-sandbox
          docker compose config >/dev/null
          docker compose -f docker-compose.yml -f docker-compose.sandbox.yml config >/dev/null
      - name: Validate Caddy
        run: |
          docker run --rm \
            -e ACME_EMAIL=admin@example.test \
            -e BASE_DOMAIN=example.test \
            -e APP_DOMAIN=code.example.test \
            -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2.11.4-alpine caddy validate --config /etc/caddy/Caddyfile
