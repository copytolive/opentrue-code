name: AI3 CopyToLive Secret Probe
on:
  push:
    branches: [ai3-copytolive-vps-probe]
    paths:
      - ".github/workflows/ai3-copytolive-secret-probe.yml"
      - "ai3-copytolive-secret-probe/**"
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: req
        shell: bash
        run: |
          FILE="$(find ai3-copytolive-secret-probe -maxdepth 1 -type f -name '*.json' | sort | tail -n1)"
          ID="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["id"])' "$FILE")"
          echo "id=$ID" >> "$GITHUB_OUTPUT"
      - name: Record secret presence only
        env:
          COPY_KEY: ${{ secrets.COPYTOLIVE_SSH_KEY }}
          COPY_HOST: ${{ secrets.COPYTOLIVE_SSH_HOST }}
          COPY_USER: ${{ secrets.COPYTOLIVE_SSH_USER }}
          GOLD_KEY: ${{ secrets.GOLD24_SSH_KEY }}
          GOLD_HOST: ${{ secrets.GOLD24_HOST }}
          GOLD_USER: ${{ secrets.GOLD24_USER }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ai3-copytolive-secret-probe-results
          python3 - <<'PY' > "ai3-copytolive-secret-probe-results/${{ steps.req.outputs.id }}.json"
          import os,json
          print(json.dumps({
            "copy_key":bool(os.environ.get("COPY_KEY")),
            "copy_host":bool(os.environ.get("COPY_HOST")),
            "copy_user":bool(os.environ.get("COPY_USER")),
            "gold_key":bool(os.environ.get("GOLD_KEY")),
            "gold_host":bool(os.environ.get("GOLD_HOST")),
            "gold_user":bool(os.environ.get("GOLD_USER"))
          }))
          PY
      - name: Commit result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "CopyToLive AI3 Secret Probe"
          git config user.email "copytolive-ai3-secretprobe@local.invalid"
          git add ai3-copytolive-secret-probe-results
          git commit -m "ai3 secret probe: ${{ steps.req.outputs.id }}" || true
          git push origin HEAD:ai3-copytolive-vps-probe
