name: Security and supply chain

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 2 * * 1"

permissions:
  contents: read

concurrency:
  group: security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  TRIVY_IMAGE: ghcr.io/aquasecurity/trivy:0.73.0@sha256:7cced7cae583819fc7806d4cbc0dbbc7cad18b99f7d3e235192e6da8c091045c
  CODE_SERVER_IMAGE: codercom/code-server:4.133.0@sha256:e073a441c61c85821a7f16b64cf93b4e77b4092899bb1f3bed906fbd558afd62

jobs:
  scope:
    runs-on: ubuntu-24.04
    outputs:
      container: ${{ steps.scope.outputs.container }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - id: scope
        name: Classify container-security relevance
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "container=true" >> "$GITHUB_OUTPUT"
            echo "CONTAINER_SECURITY_SCOPE=FULL_NON_PR"
            exit 0
          fi
          BASE="${{ github.event.pull_request.base.sha }}"
          git diff --name-only "$BASE"...HEAD | tee /tmp/security-changed-files.txt
          if grep -Eq '^(ui/|control-plane/|editor/|workers/|local-bridge/|Dockerfile|\.github/workflows/security\.yml$)' /tmp/security-changed-files.txt; then
            echo "container=true" >> "$GITHUB_OUTPUT"
            echo "CONTAINER_SECURITY_SCOPE=RELEVANT"
          else
            echo "container=false" >> "$GITHUB_OUTPUT"
            echo "CONTAINER_SECURITY_SCOPE=NOT_APPLICABLE"
          fi

  source-security:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout full history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Setup Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
      - name: Public repository policy
        run: sh scripts/validate-public-repo.sh
      - name: Gitleaks full-history secret scan
        shell: bash
        run: |
          set -euo pipefail
          report="$PWD/.gitleaks-report.json"
          docker run --rm \
            -v "$PWD:/repo" -w /repo \
            ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git --config /repo/.gitleaks.toml --redact --exit-code 0 --no-banner --report-format json --report-path /repo/.gitleaks-report.json .
          node - "$report" <<'NODE'
          const fs=require('fs');
          const {execFileSync}=require('child_process');
          const path=process.argv[2];
          const rows=fs.existsSync(path)?JSON.parse(fs.readFileSync(path,'utf8')||'[]'):[];
          const safeFixture=row=>{
            if(!/^[0-9a-f]{40}$/i.test(String(row.Commit||'')))return false;
            if(!Number.isInteger(Number(row.StartLine))||Number(row.StartLine)<1)return false;
            let source='';
            try{source=execFileSync('git',['show',`${row.Commit}:${row.File}`],{encoding:'utf8',maxBuffer:2_000_000})}catch{return false}
            const line=(source.split(/\r?\n/)[Number(row.StartLine)-1]||'').trim();
            if(row.File==='.env.example'){
              return /^(AUTH_SIGNING_SECRET|BILLING_WEBHOOK_SECRET|METRICS_TOKEN|WEBUI_SECRET_KEY|POSTGRES_PASSWORD|REDIS_PASSWORD|SANDBOX_WORKER_TOKEN)=replace-with-[A-Za-z0-9-]+$/.test(line);
            }
            if(row.File==='.github/workflows/ui-runtime.yml'){
              return /^(?:[A-Z0-9_]*(?:TOKEN|SECRET|PASSWORD|KEY)):\s*test-[A-Za-z0-9-]+$/.test(line);
            }
            return false;
          };
          const unsafe=[];
          for(const row of rows){
            const fixture=safeFixture(row);
            console.error(JSON.stringify({rule:row.RuleID,file:row.File,line:row.StartLine,commit:row.Commit,safeFixture:fixture}));
            if(!fixture)unsafe.push(row);
          }
          fs.rmSync(path,{force:true});
          if(unsafe.length){
            console.error(`GITLEAKS_BLOCKED unsafe=${unsafe.length} total=${rows.length}; secret values remain redacted`);
            process.exit(1);
          }
          console.log(`GITLEAKS_PASS unsafe=0 approvedFixtures=${rows.length}`);
          NODE
      - name: Control-plane dependency audit
        working-directory: control-plane
        run: |
          npm install --ignore-scripts --no-fund
          npm audit --audit-level=high --omit=dev
      - name: UI dependency audit
        working-directory: ui
        run: |
          npm install --ignore-scripts --no-fund
          npm audit --audit-level=high
      - name: Local Bridge dependency audit
        working-directory: local-bridge
        run: |
          npm install --ignore-scripts --no-fund
          npm audit --audit-level=high
      - name: Trivy repository vulnerability and misconfiguration scan
        run: |
          docker run --rm -v "$PWD:/work" -w /work \
            "$TRIVY_IMAGE" \
            fs --scanners vuln,misconfig --severity CRITICAL --ignore-unfixed --exit-code 1 .

  container-security:
    needs: scope
    if: needs.scope.outputs.container == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Build runtime images
        run: |
          docker build -t opentrue-ui:ci ./ui
          docker build -t opentrue-control-plane:ci ./control-plane
          docker build \
            --build-arg CODE_SERVER_IMAGE="$CODE_SERVER_IMAGE" \
            --build-arg CLINE_VERSION=4.1.3 \
            -t opentrue-editor:ci ./editor
          docker build -f workers/Dockerfile.sandbox -t opentrue-sandbox:ci workers
      - name: Scan runtime images for critical vulnerabilities
        run: |
          set -euo pipefail
          for image in opentrue-ui:ci opentrue-control-plane:ci opentrue-editor:ci opentrue-sandbox:ci; do
            echo "=== scanning $image ==="
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
              "$TRIVY_IMAGE" \
              image --scanners vuln --severity CRITICAL --ignore-unfixed --exit-code 1 "$image"
          done
      - name: Generate CycloneDX SBOMs
        run: |
          set -euo pipefail
          mkdir -p sbom
          for pair in ui=opentrue-ui:ci control-plane=opentrue-control-plane:ci editor=opentrue-editor:ci sandbox=opentrue-sandbox:ci; do
            name="${pair%%=*}"; image="${pair#*=}"
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD/sbom:/sbom" \
              "$TRIVY_IMAGE" \
              image --scanners vuln --format cyclonedx --output "/sbom/${name}.cdx.json" "$image"
          done
          sha256sum sbom/*.json | tee sbom/SHA256SUMS
      - name: Upload SBOM evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: opentrue-code-sbom-${{ github.sha }}
          path: sbom/
          if-no-files-found: error
          retention-days: 30
