name: RWACode Desktop

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'rwacode/**'
      - '.github/workflows/rwacode-desktop.yml'
  pull_request:
    paths:
      - 'rwacode/**'
      - '.github/workflows/rwacode-desktop.yml'

permissions:
  contents: read

concurrency:
  group: rwacode-desktop-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  RWACODE_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  test-and-build-macos:
    runs-on: macos-15-intel
    timeout-minutes: 40
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - name: Checkout exact candidate SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.RWACODE_CANDIDATE_SHA }}
          persist-credentials: false
      - name: Freeze candidate SHA
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL="$(git rev-parse HEAD)"
          echo "RWACODE_CANDIDATE_SHA=$RWACODE_CANDIDATE_SHA"
          echo "RWACODE_CHECKED_OUT_SHA=$ACTUAL"
          test "$ACTUAL" = "$RWACODE_CANDIDATE_SHA"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: rwacode/package-lock.json
      - name: Verify committed lockfile
        run: test -f rwacode/package-lock.json
      - name: Install dependencies reproducibly
        working-directory: rwacode
        run: npm ci --no-audit --no-fund
      - name: Static preflight
        working-directory: rwacode
        run: npm run verify:static
      - name: Unit and security tests
        working-directory: rwacode
        run: npm test
      - name: Build unsigned macOS Intel and Apple Silicon DMG and ZIP
        working-directory: rwacode
        run: npm run build:mac
      - name: Generate build manifest
        working-directory: rwacode
        env:
          RWACODE_CANDIDATE_SHA: ${{ env.RWACODE_CANDIDATE_SHA }}
        run: npm run manifest:build
      - name: Verify artifact contract
        working-directory: rwacode
        run: npm run verify:artifacts
      - name: Smoke launch packaged shell to READY
        working-directory: rwacode
        run: npm run smoke:packaged
      - name: Upload RWACode macOS artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rwacode-macos-x64-arm64-${{ github.run_id }}
          path: |
            rwacode/dist/*.dmg
            rwacode/dist/*.zip
            rwacode/dist/build-manifest.json
            rwacode/dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
