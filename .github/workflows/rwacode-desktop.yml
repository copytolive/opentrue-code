name: RWACode Desktop

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'rwacode/**'
      - '.github/workflows/rwacode-desktop.yml'
  pull_request:
    paths:
      - 'rwacode/**'
      - '.github/workflows/rwacode-desktop.yml'

permissions:
  contents: read

jobs:
  test-and-build-macos:
    runs-on: macos-15-intel
    timeout-minutes: 40
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: rwacode/package-lock.json
      - name: Verify committed lockfile
        run: test -f rwacode/package-lock.json
      - name: Install dependencies reproducibly
        working-directory: rwacode
        run: npm ci --no-audit --no-fund
      - name: Unit and security tests
        working-directory: rwacode
        run: npm test
      - name: Syntax checks
        working-directory: rwacode
        run: npm run check
      - name: Build unsigned macOS Intel and Apple Silicon DMG and ZIP
        working-directory: rwacode
        run: npm run build:mac
      - name: Verify both architectures are present
        working-directory: rwacode
        shell: bash
        run: |
          set -euo pipefail
          find dist -maxdepth 2 -type f -print
          test -f dist/RWACode-0.3.0.dmg
          test -f dist/RWACode-0.3.0-mac.zip
          test -f dist/RWACode-0.3.0-arm64.dmg
          test -f dist/RWACode-0.3.0-arm64-mac.zip
          X64_BIN='dist/mac/RWACode.app/Contents/MacOS/RWACode'
          ARM64_BIN='dist/mac-arm64/RWACode.app/Contents/MacOS/RWACode'
          test -x "$X64_BIN"
          test -x "$ARM64_BIN"
          file "$X64_BIN" | tee /tmp/rwacode-x64-file.txt
          file "$ARM64_BIN" | tee /tmp/rwacode-arm64-file.txt
          grep -Eq 'x86_64|x86-64' /tmp/rwacode-x64-file.txt
          grep -q 'arm64' /tmp/rwacode-arm64-file.txt
      - name: Upload RWACode macOS artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rwacode-macos-x64-arm64-${{ github.run_id }}
          path: |
            rwacode/dist/*.dmg
            rwacode/dist/*.zip
          if-no-files-found: error
          retention-days: 14
