name: OpenTrue Bugbot

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: bugbot-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  bugbot:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact pull request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify reviewed candidate SHA
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL="$(git rev-parse HEAD)"
          EXPECTED="${{ github.event.pull_request.head.sha }}"
          echo "BUGBOT_CANDIDATE_SHA=$EXPECTED"
          test "$ACTUAL" = "$EXPECTED"
      - name: Setup Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Review introduced diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node agent-runtime/bin/opentrue.mjs bugbot "$BASE_SHA"
