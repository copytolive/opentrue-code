name: WhatsApp AI Public Bootstrap Gate
on:
  push:
    branches:
      - whatsapp-ai-public-bootstrap
permissions:
  contents: read
jobs:
  syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Shell syntax
        run: bash -n whatsapp-ai/install.sh
