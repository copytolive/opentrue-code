name: RWACode Lockfile

on:
  push:
    branches:
      - fix/rwacode-final-hardening-1-17
    paths:
      - rwacode/package.json
      - .github/workflows/rwacode-lockfile.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/rwacode-final-hardening-1-17
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Generate deterministic lockfile
        working-directory: rwacode
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify npm ci from generated lockfile
        working-directory: rwacode
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile if changed
        shell: bash
        run: |
          set -euo pipefail
          git add rwacode/package-lock.json
          if git diff --cached --quiet; then
            echo "LOCKFILE_ALREADY_CURRENT=PASS"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Lock RWACode npm dependencies"
          git push origin HEAD:fix/rwacode-final-hardening-1-17
