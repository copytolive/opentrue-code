name: OpenTrue Code Acceptance CI
on:
  push:
    paths:
      - "control-plane/**"
      - "local-bridge/**"
      - "workers/**"
      - "loadtest/**"
      - "scripts/**"
      - "docker-compose.sandbox.yml"
      - ".github/workflows/control-plane-ci.yml"
  pull_request:
permissions:
  contents: read
concurrency:
  group: acceptance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  ACCEPTANCE_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact candidate SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.ACCEPTANCE_CANDIDATE_SHA }}
          persist-credentials: false
      - name: Freeze acceptance candidate SHA
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL="$(git rev-parse HEAD)"
          echo "ACCEPTANCE_CANDIDATE_SHA=$ACCEPTANCE_CANDIDATE_SHA"
          test "$ACTUAL" = "$ACCEPTANCE_CANDIDATE_SHA"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
      - run: npm install --ignore-scripts
        working-directory: control-plane
      - name: Block high/critical npm advisories
        working-directory: control-plane
        run: npm run audit:high
      - name: Validate Node entrypoints
        run: node --check control-plane/src/server.mjs local-bridge/src/bridge.mjs workers/vast-worker.mjs workers/sandbox-worker.mjs workers/deploy-worker.mjs scripts/mint-token.mjs scripts/model-benchmark.mjs
      - name: Validate shell entrypoints
        run: bash -n scripts/acceptance-local.sh scripts/deploy-approved.sh scripts/install-vast-worker.sh scripts/backup-restore-drill.sh scripts/sandbox-escape-test.sh scripts/install-macos.sh scripts/install-local-bridge-macos.sh scripts/install-deploy-worker-linux.sh scripts/validate-public-repo.sh
      - name: Public repository policy
        run: sh scripts/validate-public-repo.sh
      - name: Install sandbox verifier
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends bubblewrap
      - run: sh scripts/acceptance-local.sh
      - name: Prove bubblewrap isolation
        run: sudo sh scripts/sandbox-escape-test.sh
