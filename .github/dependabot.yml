version: 2
updates:
  - package-ecosystem: npm
    directory: /control-plane
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      control-plane-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /ui
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      ui-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /local-bridge
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
